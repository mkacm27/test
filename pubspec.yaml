name: printing_app
description: A Flutter application for managing and recording printing transactions inside an institute.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Core Packages
  sqflite: ^2.3.2
  path_provider: ^2.1.2
  intl: ^0.19.0

  # State Management
  flutter_riverpod: ^2.5.1

  # PDF & Sharing
  pdf: ^3.10.8
  share_plus: ^7.2.2
  printing: ^5.12.0 # Often used with the pdf package for full share/print capabilities

  # UI
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
