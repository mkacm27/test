# This is a basic workflow to help you get started with Actions.
name: Flutter Android CI/CD

# Controls when the workflow will run
on:
  # Triggers the workflow on push events but only for the "main" branch
  push:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build-android:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    name: Build Android Release APK

    steps:
      # 1. Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Sets up the Java Development Kit (JDK) environment for building Android apps.
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'gradle'

      # 3. Sets up the Flutter SDK environment.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable' # Or 'beta', 'dev', 'master'
          cache: true # Caches Flutter SDK for faster builds

      # 4. Gets Flutter dependencies.
      - name: Install dependencies
        run: flutter pub get

      # 5. (Optional) Run analyzer to check for code quality.
      - name: Analyze project
        run: flutter analyze

      # 6. Builds the release APK.
      - name: Build release APK
        run: flutter build apk --release

      # 7. Uploads the generated APK as a build artifact.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          # Name of the artifact to be uploaded.
          name: release-apk
          # Path to the file(s) to upload.
          path: build/app/outputs/flutter-apk/app-release.apk
          # How long to retain the artifact (in days).
          retention-days: 7
